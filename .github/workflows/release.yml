name: Desktop release

# Update mygo.json's version, add its section to CHANGELOG.md, commit, then
# push the matching vX.Y.Z tag. A tag builds every platform: a signed and
# notarized disk image per Mac architecture and a portable executable per
# Windows architecture, each with its signed update archive and manifest,
# uploads them to a draft release, verifies it, then publishes it, which
# makes installed launchers update to it.
#
# Manual runs build ad-hoc signed, unnotarized test builds as workflow
# artifacts and publish nothing.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Validate release version
    runs-on: ubuntu-24.04
    outputs:
      number: ${{ steps.version.outputs.number }}
      revision: ${{ steps.version.outputs.revision }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          version=$(jq -er '.version | strings' mygo.json)
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::mygo.json version must have the form X.Y.Z."
            exit 1
          fi
          if [[ "$REF_TYPE" == tag && "$REF_NAME" != "v$version" ]]; then
            echo "::error::The release tag must match v$version."
            exit 1
          fi
          if ! grep -Eq "^## \[?${version//./\\.}\]?([[:space:]]|$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md needs a '## $version' section; the update window shows it."
            exit 1
          fi
          release=false
          if [[ "$EVENT_NAME" == push && "$REF_TYPE" == tag ]]; then
            release=true
          fi
          {
            echo "number=$version"
            echo "revision=$(git rev-parse HEAD)"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"

  draft:
    name: Prepare draft release
    if: needs.version.outputs.release == 'true'
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.revision }}
          persist-credentials: false
      # One draft for every platform job to upload to: without it, each
      # concurrent `mygo build -upload` would create a draft of its own.
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.version.outputs.number }}
        run: |
          draft=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .draft")
          case "$draft" in
            "")
              awk -v v="$RELEASE_VERSION" '
                /^## / { if (found) exit; found = ($2 == v || $2 == "[" v "]"); next }
                found
              ' CHANGELOG.md > notes.md
              gh release create "$RELEASE_TAG" --verify-tag --draft \
                --title "mcl $RELEASE_TAG" --notes-file notes.md
              ;;
            true) echo "Reusing the draft release $RELEASE_TAG." ;;
            false)
              # Uploading again would replace files that installed apps
              # already update from.
              echo "::error::$RELEASE_TAG is already published; bump the version instead."
              exit 1
              ;;
            *)
              echo "::error::Multiple releases found for $RELEASE_TAG."
              exit 1
              ;;
          esac

  package:
    name: Package ${{ matrix.name }}
    needs: [version, draft]
    # The draft job is skipped for manual runs, which still package.
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.draft.result != 'failure' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple silicon
            runner: macos-15
            platform: darwin/arm64
            directory: darwin-arm64
            arch: arm64
            lipo: arm64
          - name: macOS Intel
            runner: macos-15
            platform: darwin/amd64
            directory: darwin-amd64
            arch: amd64
            lipo: x86_64
          - name: Windows x64
            runner: windows-2025
            platform: windows/amd64
            directory: windows-amd64
            arch: amd64
          - name: Windows ARM64
            runner: windows-2025
            platform: windows/arm64
            directory: windows-arm64
            arch: arm64
    env:
      CGO_ENABLED: "0"
      RELEASE: ${{ needs.version.outputs.release }}
      VERSION: ${{ needs.version.outputs.number }}
      DIRECTORY: ${{ matrix.directory }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Import the Developer ID certificate and notary credentials
        if: runner.os == 'macOS' && env.RELEASE == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          for name in MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::The $name secret is missing."
              exit 1
            fi
          done
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -base64 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          # Default and first in the search list, so codesign finds the
          # identity and notarytool the mcl-notary profile of mygo.json.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$keychain"
          echo "$APPLE_API_KEY" > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials mcl-notary --keychain "$keychain" \
            --key "$RUNNER_TEMP/notary.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID"
          rm -f "$RUNNER_TEMP/notary.p8"
          # Sign by the certificate's SHA-1 so its name never has to live in
          # the repository or the workflow.
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | awk '/"Developer ID Application: / { print $2; exit }')
          if [[ -z "$identity" ]]; then
            echo "::error::MACOS_CERTIFICATE holds no Developer ID Application identity."
            exit 1
          fi
          echo "MACOS_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
      # Without -upload: mygo would also publish install.sh, install.ps1 and
      # a SHA256SUMS that concurrent jobs race on. The release keeps the
      # disk images, executables and update files only.
      - name: Build, sign and notarize
        if: env.RELEASE == 'true'
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          if [[ -z "$MYGO_UPDATER_PRIVATE_KEY" ]]; then
            echo "::error::The MYGO_UPDATER_PRIVATE_KEY secret is missing."
            exit 1
          fi
          if [[ "$RUNNER_OS" == macOS ]]; then
            signing=(-sign "$MACOS_SIGNING_IDENTITY")
          else
            # macos.notarize applies to disk images only.
            signing=(-skip-notarize)
          fi
          go tool mygo build -platform "$PLATFORM" -o build/release "${signing[@]}" -skip-installer
      - name: Build test package
        if: env.RELEASE != 'true'
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: go tool mygo build -platform "$PLATFORM" -o build/release -sign - -skip-notarize -skip-installer
      - name: Verify Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "build/release/$env:DIRECTORY"
          $archive = if ($env:RELEASE -eq "true") { "$out/mcl-$env:VERSION-$env:DIRECTORY.tar.gz" } else { "" }
          ./scripts/verify-windows-exe.ps1 -Application "$out/mcl.exe" -Arch $env:ARCH -Archive $archive
      - name: Verify macOS bundle
        if: runner.os == 'macOS'
        env:
          LIPO: ${{ matrix.lipo }}
        run: |
          bundle="build/release/$DIRECTORY/mcl.app"
          dmg="build/release/$DIRECTORY/mcl-$VERSION-$ARCH.dmg"
          arches=$(lipo -archs "$bundle/Contents/MacOS/mcl")
          if [[ "$arches" != "$LIPO" ]]; then
            echo "::error::Expected $LIPO only, found $arches."
            exit 1
          fi
          codesign --verify --deep --strict "$bundle"
          hdiutil verify "$dmg"
          if [[ "$RELEASE" == true ]]; then
            details=$(codesign -dvv "$bundle" 2>&1)
            grep -q '^Authority=Developer ID Application: ' <<< "$details" || { echo "::error::Not signed with a Developer ID."; exit 1; }
            grep -q 'flags=.*runtime' <<< "$details" || { echo "::error::Hardened runtime is off."; exit 1; }
            xcrun stapler validate "$bundle"
            xcrun stapler validate "$dmg"
            spctl --assess --type execute --verbose=4 "$bundle"
            spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          fi
      - name: Collect release files
        shell: bash
        run: |
          out="build/release/$DIRECTORY"
          mkdir -p dist/manifest
          if [[ "$RUNNER_OS" == macOS ]]; then
            cp "$out/mcl-$VERSION-$ARCH.dmg" dist/
          else
            # A portable executable, named per architecture so both fit in
            # one release; the launcher keeps whatever name the user gives it.
            cp "$out/mcl.exe" "dist/mcl-$VERSION-windows-$ARCH.exe"
          fi
          if [[ "$RELEASE" == true ]]; then
            manifest="$out/update-$DIRECTORY.json"
            test -s "$manifest"
            test -s "$out/mcl-$VERSION-$DIRECTORY.tar.gz"
            jq -e --arg v "$VERSION" '.version == $v' "$manifest" > /dev/null
            cp "$out/mcl-$VERSION-$DIRECTORY.tar.gz" dist/
            find "$out" -maxdepth 1 -name '*.delta' -exec cp {} dist/ \;
            cp "$manifest" dist/manifest/
          fi
          ls -la dist dist/manifest
      - name: Upload to the draft release
        if: env.RELEASE == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          files=(dist/*.*)
          gh release upload "$RELEASE_TAG" --clobber "${files[@]}"
          # Last, so a manifest never names a file that is not there yet.
          gh release upload "$RELEASE_TAG" --clobber dist/manifest/*
      - uses: actions/upload-artifact@v7
        with:
          name: mcl-${{ matrix.directory }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error
          overwrite: true

  publish:
    name: Publish GitHub release
    if: needs.version.outputs.release == 'true'
    needs: [version, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Verify assets, write checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.version.outputs.number }}
          RELEASE_REVISION: ${{ needs.version.outputs.revision }}
        run: |
          revision=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
          if [[ "$revision" != "$RELEASE_REVISION" ]]; then
            echo "::error::The release tag no longer points to the packaged commit."
            exit 1
          fi
          assets=$(gh release view "$RELEASE_TAG" --json assets \
            --jq '.assets[] | select(.state == "uploaded") | [.name, .digest] | @tsv')
          required=(
            "mcl-$RELEASE_VERSION-arm64.dmg"
            "mcl-$RELEASE_VERSION-amd64.dmg"
            "mcl-$RELEASE_VERSION-windows-amd64.exe"
            "mcl-$RELEASE_VERSION-windows-arm64.exe"
          )
          for target in darwin-arm64 darwin-amd64 windows-amd64 windows-arm64; do
            required+=("mcl-$RELEASE_VERSION-$target.tar.gz" "update-$target.json")
          done
          for name in "${required[@]}"; do
            if ! cut -f 1 <<< "$assets" | grep -Fxq "$name"; then
              echo "::error::The release is missing $name."
              exit 1
            fi
          done
          for name in install.sh install.ps1; do
            if cut -f 1 <<< "$assets" | grep -Fxq "$name"; then
              gh release delete-asset "$RELEASE_TAG" "$name" --yes
            fi
          done
          awk -F '\t' '$1 != "SHA256SUMS" && $1 !~ /^install\./ && $2 ~ /^sha256:/ { sub(/^sha256:/, "", $2); print $2 "  " $1 }' \
            <<< "$assets" | sort -k 2 > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$RELEASE_TAG" --clobber SHA256SUMS
          gh release edit "$RELEASE_TAG" --draft=false --latest
